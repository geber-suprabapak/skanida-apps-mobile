---
name: Lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon --console=plain
