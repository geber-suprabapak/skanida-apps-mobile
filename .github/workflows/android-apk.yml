---
name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Quality Gate (Format, Detekt, Tests & Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      verified_sha: ${{ steps.record_sha.outputs.verified_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run format, static analysis, unit tests, and Android Lint
        run: ./gradlew spotlessCheck detekt :app:testDebugUnitTest :app:lintRelease --no-daemon --console=plain

      - name: Record verified revision
        id: record_sha
        run: |
          VERIFIED_SHA=$(git rev-parse HEAD)
          echo "verified_sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Android APK release gate"
            echo ""
            echo "Verify PASS (\`./gradlew spotlessCheck detekt :app:testDebugUnitTest :app:lintRelease\`)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Verified source revision | \`$VERIFIED_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Release & Staging APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify

    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Assert built revision matches verified revision
        run: |
          BUILD_SHA=$(git rev-parse HEAD)
          echo "Built revision: $BUILD_SHA"
          echo "Verified revision: ${{ needs.verify.outputs.verified_sha }}"
          test "$BUILD_SHA" = "${{ needs.verify.outputs.verified_sha }}" || {
            echo "Refusing to build: checked-out revision differs from the verified revision."
            exit 1
          }

      - name: Restore google-services.json if provided
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p certs
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > certs/google-services.json
            test -s certs/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without embedded Firebase config."
          fi

      - name: Restore release signing config if provided
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            mkdir -p certs
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > certs/release.keystore
            test -s certs/release.keystore
            printf 'storeFile=certs/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > signing.properties
          else
            echo "Release signing secrets not configured; building unsigned release APK and debug-signed staging APK."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release and staging APKs
        run: ./gradlew :app:assembleRelease :app:assembleStaging --no-daemon --console=plain

      - name: Record source SHA and APK SHA-256 in run summary
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          apk_count=0
          {
            echo "## Android APK Artifacts"
            echo ""
            echo "| Artifact | SHA-256 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r apk; do
            apk_count=$((apk_count + 1))
            APK_SHA=$(sha256sum "$apk" | awk '{print $1}')
            echo "| \`$apk\` | \`$APK_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "APK: $apk"
            echo "SHA-256: $APK_SHA"
          done < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "$apk_count" -eq 0 ]; then
            echo "No APK produced; refusing to record a checksum."
            exit 1
          fi
          {
            echo ""
            echo "| Built source revision | \`$SOURCE_SHA\` |"
            echo "| Artifact retention | 90 days (GitHub Actions artifact \`skanida-apps-android-apk\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skanida-apps-android-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
